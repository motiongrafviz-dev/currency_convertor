<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: rgba(30,41,59,0.9);
        padding: 35px;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
    }

    h2 {
        margin-bottom: 5px;
    }

    p {
        color: #94a3b8;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }

    .form-group label {
        margin-bottom: 5px;
        font-size: 14px;
        color: #94a3b8;
    }

    .form-group input {
        padding: 12px;
        border-radius: 10px;
        border: none;
        outline: none;
        background: #020617;
        color: white;
        border: 1px solid rgba(255,255,255,0.1);
        transition: 0.2s;
    }

    .form-group input:focus {
        border: 1px solid #2563eb;
        box-shadow: 0 0 10px #2563eb55;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }

    .register-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        color: #94a3b8;
    }

    .register-link a {
        color: #2563eb;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="card">
    <h2>Вход</h2>
    <p>Войдите в свой аккаунт</p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" name="username" placeholder="Введите username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Введите email" required>
        </div>

        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Введите пароль" required>
        </div>

        <button class="submit-btn" type="submit">Войти</button>
    </form>

    <div class="register-link">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </div>
</div>

</body>
</html>
